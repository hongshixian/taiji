services:
  # ─── PostgreSQL ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-taiji}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-taiji_pw}
      - POSTGRES_DB=${POSTGRES_DB:-taiji}
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taiji} -d ${POSTGRES_DB:-taiji}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── Keycloak 逻辑数据库初始化 ─────────────────
  keycloak-db-init:
    image: postgres:16-alpine
    environment:
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER:-taiji}
      - PGPASSWORD=${POSTGRES_PASSWORD:-taiji_pw}
      - KEYCLOAK_DB=${KEYCLOAK_DB:-keycloak}
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$${KEYCLOAK_DB}'")" != "1" ]; then
          createdb "$${KEYCLOAK_DB}"
        fi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ─── Redis ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── IAM 事件总线 ──────────────────────────────
  nats:
    image: nats:2.11.8-alpine
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      - NATS_USER=${NATS_USER:-taiji}
      - NATS_PASSWORD=${NATS_PASSWORD:-taiji_nats_dev}
    volumes:
      - ./docker/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4222"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── Keycloak IAM ──────────────────────────────
  keycloak:
    build:
      context: .
      dockerfile: docker/Dockerfile.keycloak
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.7.0}
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      - KC_DB_USERNAME=${POSTGRES_USER:-taiji}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-taiji_pw}
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_FEATURES=organization:v1
      - KC_HOSTNAME=${IAM_PUBLIC_URL:-http://localhost:8180}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-kcadmin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-dev-only-change-me}
      - TAIJI_PUBLIC_URL=${TAIJI_PUBLIC_URL:-http://localhost:8080}
      - TAIJI_OIDC_CLIENT_SECRET=${TAIJI_OIDC_CLIENT_SECRET:-taiji-web-dev-secret}
      - TAIJI_RECONCILER_CLIENT_SECRET=${TAIJI_RECONCILER_CLIENT_SECRET:-taiji-reconciler-dev-secret}
      - NATS_URL=nats://${NATS_USER:-taiji}:${NATS_PASSWORD:-taiji_nats_dev}@nats:4222
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ─── Flask 后端 ────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-taiji}:${POSTGRES_PASSWORD:-taiji_pw}@postgres:5432/${POSTGRES_DB:-taiji}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - TASK_LOG_ROOT=/app/logs
      # HF 镜像（国内加速）与缓存
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_HOME=/app/hf_cache
      - HF_DATASETS_CACHE=/app/hf_cache/datasets
      - HUGGINGFACE_HUB_CACHE=/app/hf_cache/hub
      # 初始管理员（仅首次部署生效；ADMIN_PASSWORD 未设则随机生成并打印到日志）
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@taiji.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app_data:/app/data
      - ./app_logs:/app/logs
      - ./hf_cache:/app/hf_cache
    restart: unless-stopped

  # ─── Celery Worker ─────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: ["celery", "-A", "celery_app", "worker", "-l", "info", "--concurrency=4", "--max-tasks-per-child=10", "-Ofair"]
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-taiji}:${POSTGRES_PASSWORD:-taiji_pw}@postgres:5432/${POSTGRES_DB:-taiji}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TASK_LOG_ROOT=/app/logs
      - RUN_MIGRATIONS=false
      # HF 镜像（国内加速）与缓存
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_HOME=/app/hf_cache
      - HF_DATASETS_CACHE=/app/hf_cache/datasets
      - HUGGINGFACE_HUB_CACHE=/app/hf_cache/hub
      # inspect_ai 日志级别
      - INSPECT_LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app_data:/app/data
      - ./app_logs:/app/logs
      - ./hf_cache:/app/hf_cache
    restart: unless-stopped

  # ─── Vue 前端 ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nats_data:
