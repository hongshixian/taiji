services:
  # ─── PostgreSQL ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-taiji}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-taiji_pw}
      - POSTGRES_DB=${POSTGRES_DB:-taiji}
    volumes:
      - ../../pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taiji} -d ${POSTGRES_DB:-taiji}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── Keycloak 逻辑数据库初始化 ─────────────────
  keycloak-db-init:
    image: postgres:16-alpine
    environment:
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER:-taiji}
      - PGPASSWORD=${POSTGRES_PASSWORD:-taiji_pw}
      - KEYCLOAK_DB=${KEYCLOAK_DB:-keycloak}
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$${KEYCLOAK_DB}'")" != "1" ]; then
          createdb "$${KEYCLOAK_DB}"
        fi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ─── Redis ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── IAM 事件总线 ──────────────────────────────
  nats:
    image: nats:2.11.8-alpine
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      - NATS_USER=${NATS_USER:-taiji}
      - NATS_PASSWORD=${NATS_PASSWORD:-taiji_nats_dev}
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4222"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── Keycloak IAM ──────────────────────────────
  keycloak:
    image: taiji-keycloak:${KEYCLOAK_VERSION:-26.7.0}
    build:
      context: ../..
      dockerfile: deploy/taiji-docker/Dockerfile.keycloak
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.7.0}
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      - KC_DB_USERNAME=${POSTGRES_USER:-taiji}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-taiji_pw}
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_FEATURES=organization:v1
      - KC_HOSTNAME=${IAM_PUBLIC_URL:-http://localhost:8180}
      - KC_PROXY_HEADERS=${KC_PROXY_HEADERS:-xforwarded}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-kcadmin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-dev-only-change-me}
      - TAIJI_PUBLIC_URL=${TAIJI_PUBLIC_URL:-http://localhost:28080}
      - TAIJI_OIDC_CLIENT_SECRET=${TAIJI_OIDC_CLIENT_SECRET:-taiji-web-dev-secret}
      - TAIJI_RECONCILER_CLIENT_SECRET=${TAIJI_RECONCILER_CLIENT_SECRET:-taiji-reconciler-dev-secret}
      - TAIJI_MIGRATOR_CLIENT_SECRET=${TAIJI_MIGRATOR_CLIENT_SECRET:-taiji-migrator-dev-secret}
      - IAM_MIGRATION_ENABLED=${IAM_MIGRATION_ENABLED:-false}
      - NATS_URL=nats://${NATS_USER:-taiji}:${NATS_PASSWORD:-taiji_nats_dev}@nats:4222
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ─── IAM 反向代理协议归一化 ────────────────────
  # 公网 HTTPS 在 FRP 侧终止；此代理覆盖转发头，避免 Keycloak 将请求误判为 HTTP。
  iam-proxy:
    image: nginx:alpine
    environment:
      - IAM_PROXY_HOST=${IAM_PROXY_HOST:-localhost}
      - IAM_PROXY_SCHEME=${IAM_PROXY_SCHEME:-http}
      - IAM_PROXY_PORT=${IAM_PROXY_PORT:-8180}
    volumes:
      - ./nginx-iam.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/realms/fangcun/taiji-iam/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── IAM 业务管理员一次性初始化 ─────────────────
  iam-bootstrap:
    image: taiji-keycloak:${KEYCLOAK_VERSION:-26.7.0}
    build:
      context: ../..
      dockerfile: deploy/taiji-docker/Dockerfile.keycloak
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.7.0}
    entrypoint: ["/opt/keycloak/bin/taiji-iam-bootstrap.sh"]
    environment:
      - IAM_BOOTSTRAP_ENABLED=${IAM_BOOTSTRAP_ENABLED:-true}
      - IAM_REALM_RECONCILE_ENABLED=${IAM_REALM_RECONCILE_ENABLED:-true}
      - IAM_REALM=fangcun
      - IAM_PUBLIC_URL=${IAM_PUBLIC_URL:-http://localhost:8180}
      - IAM_BOOTSTRAP_ADMIN_EMAIL=${IAM_BOOTSTRAP_ADMIN_EMAIL:-admin@taiji.local}
      - TAIJI_PUBLIC_URL=${TAIJI_PUBLIC_URL:-http://localhost:28080}
      - TAIJI_PUBLIC_URLS=${TAIJI_PUBLIC_URLS:-}
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-kcadmin}
      - KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-dev-only-change-me}
      - TAIJI_OIDC_CLIENT_SECRET=${TAIJI_OIDC_CLIENT_SECRET:-taiji-web-dev-secret}
      - TAIJI_RECONCILER_CLIENT_SECRET=${TAIJI_RECONCILER_CLIENT_SECRET:-taiji-reconciler-dev-secret}
      - TAIJI_MIGRATOR_CLIENT_SECRET=${TAIJI_MIGRATOR_CLIENT_SECRET:-taiji-migrator-dev-secret}
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  # ─── Flask 后端 ────────────────────────────────
  backend:
    build:
      context: ../..
      dockerfile: deploy/taiji-docker/Dockerfile.backend
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-taiji}:${POSTGRES_PASSWORD:-taiji_pw}@postgres:5432/${POSTGRES_DB:-taiji}
      - REDIS_URL=redis://redis:6379/0
      - AUTH_MODE=${AUTH_MODE:-oidc}
      - IAM_REALM=fangcun
      - IAM_PUBLIC_URL=${IAM_PUBLIC_URL:-http://localhost:8180}
      - IAM_INTERNAL_URL=http://keycloak:8080
      - TAIJI_PUBLIC_URL=${TAIJI_PUBLIC_URL:-http://localhost:28080}
      - TAIJI_PUBLIC_URLS=${TAIJI_PUBLIC_URLS:-}
      - TAIJI_OIDC_CLIENT_ID=taiji-web
      - TAIJI_OIDC_CLIENT_SECRET=${TAIJI_OIDC_CLIENT_SECRET:-taiji-web-dev-secret}
      - TAIJI_RECONCILER_CLIENT_SECRET=${TAIJI_RECONCILER_CLIENT_SECRET:-taiji-reconciler-dev-secret}
      - TAIJI_MIGRATOR_CLIENT_SECRET=${TAIJI_MIGRATOR_CLIENT_SECRET:-taiji-migrator-dev-secret}
      - IAM_IDENTITY_CACHE_SECONDS=${IAM_IDENTITY_CACHE_SECONDS:-300}
      - SESSION_IDLE_SECONDS=${SESSION_IDLE_SECONDS:-7200}
      - SESSION_ABSOLUTE_SECONDS=${SESSION_ABSOLUTE_SECONDS:-86400}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - TASK_LOG_ROOT=/app/logs
      # HF 镜像（国内加速）与缓存
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_HOME=/app/hf_cache
      - HF_DATASETS_CACHE=/app/hf_cache/datasets
      - HUGGINGFACE_HUB_CACHE=/app/hf_cache/hub
      # 初始管理员（仅首次部署生效；ADMIN_PASSWORD 未设则随机生成并打印到日志）
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@taiji.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      iam-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../app_data:/app/data
      - ../../app_logs:/app/logs
      - ../../hf_cache:/app/hf_cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ─── IAM 事件投影与周期对账 ─────────────────────
  iam-projector:
    build:
      context: ../..
      dockerfile: deploy/taiji-docker/Dockerfile.backend
    command: ["python", "iam_projector.py"]
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-taiji}:${POSTGRES_PASSWORD:-taiji_pw}@postgres:5432/${POSTGRES_DB:-taiji}
      - REDIS_URL=redis://redis:6379/0
      - AUTH_MODE=oidc
      - IAM_REALM=fangcun
      - IAM_PUBLIC_URL=${IAM_PUBLIC_URL:-http://localhost:8180}
      - IAM_INTERNAL_URL=http://keycloak:8080
      - TAIJI_PUBLIC_URL=${TAIJI_PUBLIC_URL:-http://localhost:28080}
      - TAIJI_OIDC_CLIENT_SECRET=${TAIJI_OIDC_CLIENT_SECRET:-taiji-web-dev-secret}
      - TAIJI_RECONCILER_CLIENT_SECRET=${TAIJI_RECONCILER_CLIENT_SECRET:-taiji-reconciler-dev-secret}
      - TAIJI_MIGRATOR_CLIENT_SECRET=${TAIJI_MIGRATOR_CLIENT_SECRET:-taiji-migrator-dev-secret}
      - NATS_URL=nats://${NATS_USER:-taiji}:${NATS_PASSWORD:-taiji_nats_dev}@nats:4222
      - IAM_RECONCILE_INTERVAL_SECONDS=${IAM_RECONCILE_INTERVAL_SECONDS:-300}
      - IAM_EVENT_BATCH_SIZE=${IAM_EVENT_BATCH_SIZE:-10}
      - IAM_EVENT_ACK_WAIT_SECONDS=${IAM_EVENT_ACK_WAIT_SECONDS:-300}
      - RUN_MIGRATIONS=false
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  # ─── Celery Worker ─────────────────────────────
  worker:
    build:
      context: ../..
      dockerfile: deploy/taiji-docker/Dockerfile.worker
    command: ["celery", "-A", "celery_app", "worker", "-l", "info", "--concurrency=4", "--max-tasks-per-child=10", "-Ofair"]
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-taiji}:${POSTGRES_PASSWORD:-taiji_pw}@postgres:5432/${POSTGRES_DB:-taiji}
      - REDIS_URL=redis://redis:6379/0
      - AUTH_MODE=${AUTH_MODE:-oidc}
      - IAM_REALM=fangcun
      - IAM_PUBLIC_URL=${IAM_PUBLIC_URL:-http://localhost:8180}
      - IAM_INTERNAL_URL=http://keycloak:8080
      - TAIJI_PUBLIC_URL=${TAIJI_PUBLIC_URL:-http://localhost:28080}
      - TAIJI_OIDC_CLIENT_ID=taiji-web
      - TAIJI_OIDC_CLIENT_SECRET=${TAIJI_OIDC_CLIENT_SECRET:-taiji-web-dev-secret}
      - TAIJI_RECONCILER_CLIENT_SECRET=${TAIJI_RECONCILER_CLIENT_SECRET:-taiji-reconciler-dev-secret}
      - TAIJI_MIGRATOR_CLIENT_SECRET=${TAIJI_MIGRATOR_CLIENT_SECRET:-taiji-migrator-dev-secret}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TASK_LOG_ROOT=/app/logs
      - RUN_MIGRATIONS=false
      # HF 镜像（国内加速）与缓存
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_HOME=/app/hf_cache
      - HF_DATASETS_CACHE=/app/hf_cache/datasets
      - HUGGINGFACE_HUB_CACHE=/app/hf_cache/hub
      # inspect_ai 日志级别
      - INSPECT_LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../app_data:/app/data
      - ../../app_logs:/app/logs
      - ../../hf_cache:/app/hf_cache
    restart: unless-stopped

  # ─── Vue 前端 ──────────────────────────────────
  frontend:
    build:
      context: ../..
      dockerfile: deploy/taiji-docker/Dockerfile.frontend
    ports:
      - "${TAIJI_PORT:-28080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nats_data:
