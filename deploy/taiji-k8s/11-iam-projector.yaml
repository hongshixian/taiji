apiVersion: apps/v1
kind: Deployment
metadata:
  name: taiji-iam-projector
  labels:
    app.kubernetes.io/name: iam-projector
    app.kubernetes.io/part-of: taiji
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iam-projector
      app.kubernetes.io/part-of: taiji
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iam-projector
        app.kubernetes.io/part-of: taiji
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: iam-projector
          image: harbor.aixiongan.org.cn:9443/lihao/taiji-backend:b059d56-r2
          imagePullPolicy: IfNotPresent
          args: ["python", "iam_projector.py"]
          envFrom:
            - configMapRef:
                name: taiji-config
            - secretRef:
                name: taiji-secrets
          env:
            - name: RUN_MIGRATIONS
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
