apiVersion: v1
kind: Service
metadata:
  name: iam-proxy
  labels:
    app.kubernetes.io/name: iam-proxy
    app.kubernetes.io/part-of: taiji
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iam-proxy
    app.kubernetes.io/part-of: taiji
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taiji-iam-proxy
  labels:
    app.kubernetes.io/name: iam-proxy
    app.kubernetes.io/part-of: taiji
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iam-proxy
      app.kubernetes.io/part-of: taiji
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iam-proxy
        app.kubernetes.io/part-of: taiji
    spec:
      containers:
        - name: nginx
          image: harbor.aixiongan.org.cn:9443/lihao/nginx:alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: IAM_PROXY_HOST
              valueFrom:
                configMapKeyRef:
                  name: taiji-config
                  key: IAM_PROXY_HOST
            - name: IAM_PROXY_SCHEME
              valueFrom:
                configMapKeyRef:
                  name: taiji-config
                  key: IAM_PROXY_SCHEME
            - name: IAM_PROXY_PORT
              valueFrom:
                configMapKeyRef:
                  name: taiji-config
                  key: IAM_PROXY_PORT
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/fangcun/taiji-iam/health
              port: http
              httpHeaders:
                - name: Host
                  value: iam.lihao.fun
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: taiji-iam-proxy-config
