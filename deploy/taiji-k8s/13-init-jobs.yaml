apiVersion: batch/v1
kind: Job
metadata:
  name: taiji-iam-bootstrap
  labels:
    app.kubernetes.io/name: iam-bootstrap
    app.kubernetes.io/part-of: taiji
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iam-bootstrap
        app.kubernetes.io/part-of: taiji
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-keycloak
          image: harbor.aixiongan.org.cn:9443/lihao/nginx:alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - until wget -q -O /dev/null http://keycloak:8080/iam/realms/fangcun; do sleep 5; done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: iam-bootstrap
          image: harbor.aixiongan.org.cn:9443/lihao/taiji-keycloak:b059d56
          imagePullPolicy: IfNotPresent
          command: ["/opt/keycloak/bin/taiji-iam-bootstrap.sh"]
          envFrom:
            - configMapRef:
                name: taiji-config
            - secretRef:
                name: taiji-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
