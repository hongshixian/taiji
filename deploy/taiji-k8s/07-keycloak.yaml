apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: taiji
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: taiji
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taiji-keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: taiji
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/part-of: taiji
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: taiji
    spec:
      initContainers:
        - name: create-keycloak-database
          image: harbor.aixiongan.org.cn:9443/lihao/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - |
              until pg_isready -h postgres -U "$POSTGRES_USER" -d postgres; do sleep 3; done
              if [ "$(psql -h postgres -U "$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$KEYCLOAK_DB'")" != "1" ]; then
                createdb -h postgres -U "$POSTGRES_USER" "$KEYCLOAK_DB"
              fi
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: taiji-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: taiji-secrets
                  key: POSTGRES_PASSWORD
            - name: KEYCLOAK_DB
              valueFrom:
                secretKeyRef:
                  name: taiji-secrets
                  key: KEYCLOAK_DB
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: keycloak
          image: harbor.aixiongan.org.cn:9443/lihao/taiji-keycloak:fa5e890-r4
          imagePullPolicy: IfNotPresent
          args: ["start", "--import-realm"]
          envFrom:
            - configMapRef:
                name: taiji-config
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              valueFrom:
                secretKeyRef:
                  name: taiji-secrets
                  key: KC_DB_URL
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: taiji-secrets
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taiji-secrets
                  key: POSTGRES_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: taiji-secrets
                  key: KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taiji-secrets
                  key: KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD
            - name: TAIJI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taiji-secrets
                  key: TAIJI_OIDC_CLIENT_SECRET
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /iam/health/started
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /iam/health/ready
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /iam/health/live
              port: management
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2500Mi
