apiVersion: v1
kind: Secret
metadata:
  name: taiji-secrets
  namespace: lihao
type: Opaque
stringData:
  POSTGRES_USER: taiji
  POSTGRES_PASSWORD: replace-with-random-password
  POSTGRES_DB: taiji
  KEYCLOAK_DB: keycloak
  KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
  DATABASE_URL: postgresql+psycopg://taiji:replace-with-url-safe-password@postgres:5432/taiji
  NATS_USER: taiji
  NATS_PASSWORD: replace-with-random-password
  NATS_URL: nats://taiji:replace-with-url-safe-password@nats:4222
  SECRET_KEY: replace-with-random-secret
  JWT_SECRET_KEY: replace-with-random-secret
  KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: kcadmin
  KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: replace-with-random-password
  TAIJI_OIDC_CLIENT_SECRET: replace-with-random-secret
  TAIJI_RECONCILER_CLIENT_SECRET: replace-with-random-secret
  TAIJI_MIGRATOR_CLIENT_SECRET: replace-with-random-secret
  ADMIN_USERNAME: admin
  ADMIN_EMAIL: admin@taiji.local
  ADMIN_PASSWORD: ""
  IAM_BOOTSTRAP_ADMIN_EMAIL: admin@taiji.local
