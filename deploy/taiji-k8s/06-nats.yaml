apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: taiji
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: taiji
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitoring
      port: 8222
      targetPort: monitoring
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: taiji-nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: taiji
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/part-of: taiji
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: taiji
    spec:
      containers:
        - name: nats
          image: harbor.aixiongan.org.cn:9443/lihao/nats:2.11.8-alpine
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/nats/nats.conf"]
          env:
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: taiji-secrets
                  key: NATS_USER
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taiji-secrets
                  key: NATS_PASSWORD
          ports:
            - name: client
              containerPort: 4222
            - name: monitoring
              containerPort: 8222
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nats/nats.conf
              subPath: nats.conf
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: taiji-nats-config
        - name: data
          persistentVolumeClaim:
            claimName: taiji-nats-data
